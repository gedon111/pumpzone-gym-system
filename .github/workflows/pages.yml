# Online demo on GitHub Pages.
#
# GitHub Pages can only host fixed files, so this builds a READ-ONLY
# snapshot of the app: a fresh database with FAKE demo data only
# (seed_demo), every screen saved as HTML (export_static), then published.
# No real member data is involved: the database exists only on GitHub's
# build machine and is thrown away afterwards.
#
# Runs on every push to main, and on demand (Actions tab > Run workflow).
# One-time setup on GitHub: Settings > Pages > Source: "GitHub Actions".

name: Online demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python manage.py test

      - name: Build the demo snapshot (fake data only)
        env:
          PUMPZONE_DATA_DIR: ${{ runner.temp }}/pumpzone-demo
        run: |
          python manage.py migrate
          python manage.py seed_demo
          python manage.py export_static _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
