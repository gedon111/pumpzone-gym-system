{# Temporary login page. Gets the Pumpzone design in Step 3. #}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in · Pumpzone</title></head>
<body>
  <h1>Pumpzone sign in</h1>
  {% if form.errors %}<p>Wrong username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
